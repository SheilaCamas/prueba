<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joshua</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container-hero">
            <div class="container hero">
                <div class="customer-support">
                    <i class="fa-solid fa-headset"></i>
                    <div class="content-customer-support">
                        <span class="text">Soporte al cliente</span>
                        <span class="number">123-456-7890</span>
                    </div>
                </div>
                <div class="container-logo">
                    <i class="fa-solid fa-mug-hot"></i>
                    <h1 class="logo"><a href="#">Comunidad "Mujeres Ingenieras"</a></h1>
                </div>
                <div class="container-user">
                    <i class="fa-solid fa-user"></i>
                    <i class="fa-solid fa-basket-shopping"></i>
                    <div class="content-shopping-cart">
                        <span class="text">Carrito</span>
                        <span class="number">(0)</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-navbar">
            <nav class="navbar container">
                <i class="fa-solid fa-bars"></i>
                <ul class="menu">
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#moca-helado">Moca Helado</a></li>
                    <li><a href="#expreso">Expreso</a></li>
                    <li><a href="#capuchino">Capuchino</a></li>
                    <li><a href="#mas">Más</a></li>
                    <li><a href="#blog">Blog</a></li>
                </ul>
                <form class="search-form">
                    <input type="search" placeholder="Buscar..." />
                    <button class="btn-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
            </nav>
        </div>
    </header>
    
    <section id="inicio" class="banner">
        <div class="content-banner">
            <p>Café Delicioso</p>
            <h2>100% Natural <br />Café Fresco</h2>
            <a href="#">Comprar ahora</a>
        </div>
    </section>
    
    <section id="moca-helado" class="top-categories">
        <h1 class="heading-1">Moca Helado</h1>
        <!-- Contenido de Moca Helado -->
    </section>
    
    <section id="expreso" class="top-categories">
        <h1 class="heading-1">Expreso</h1>
        <!-- Contenido de Expreso -->
    </section>
    
    <section id="capuchino" class="top-categories">
        <h1 class="heading-1">Capuchino</h1>
        <!-- Contenido de Capuchino -->
    </section>
    
    <section id="mas" class="top-products">
        <h1 class="heading-1">Más</h1>
        <!-- Contenido de Más -->
    </section>
    
    <section id="blog" class="blogs">
        <h1 class="heading-1">Últimos Blogs</h1>
        <!-- Contenido del Blog -->
    </section>
</body>
</html>
